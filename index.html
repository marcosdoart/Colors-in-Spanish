<!DOCTYPE html>
<html lang="en">
  <head>

  <meta charset="UTF-8" />
  <title>Spanish Vocabulary</title>
  <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
<h1>Colors</h1>
<h2>Learn the colors in Spanish!</h2>

<div class="palette">
<div class="color-box" draggable="true" data-color="red" style="background:red">Rojo</div>
<div class="color-box" draggable="true" data-color="blue" style="background:blue">Azul</div>
<div class="color-box" draggable="true" data-color="yellow" style="background:yellow">Amarillo</div>
<div class="color-box" draggable="true" data-color="orange" style="background:orange">Anaranjado</div>
<div class="color-box" draggable="true" data-color="green" style="background:green">Verde</div>
</div> 

<h2>Mix Area</h2>
<div class="mix-area" id="mixArea">
Drop two colors Here
</div>

<h2>Result</h2>

<div class="result" id="result">
  <span id="colorLabel"></span>
</div>

<script src="script.js"></script>
</body>
</html>
